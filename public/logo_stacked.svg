<svg xmlns="http://www.w3.org/2000/svg" width="198" height="170" viewBox="0 0 198 170" fill="none">
  <!-- Allseerr stacked logo: icon on top, wordmark below.
       Same composition as logo_full.svg but vertical for square /
       portrait usages (splash screens, social cards). -->
  <defs>
    <linearGradient id="hubGradient" x1="99" x2="99" y1="30" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C395FC"/>
      <stop offset="1" stop-color="#4F65F5"/>
    </linearGradient>
    <linearGradient id="hubInner" x1="93" x2="93" y1="42" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prefixGradient" x1="38" x2="74" y1="148" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C395FC"/>
      <stop offset="1" stop-color="#4F65F5"/>
    </linearGradient>
  </defs>

  <!-- Icon centred horizontally, top half (96 high, drawn at x = 99 centre) -->
  <g transform="translate(51, 0)">
    <circle cx="48" cy="48" r="36" stroke="#374151" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
    <circle cx="48" cy="12" r="7" fill="#EF4444"/>
    <circle cx="79.18" cy="30" r="7" fill="#F59E0B"/>
    <circle cx="79.18" cy="66" r="7" fill="#10B981"/>
    <circle cx="48" cy="84" r="7" fill="#EC4899"/>
    <circle cx="16.82" cy="66" r="7" fill="#F97316"/>
    <circle cx="16.82" cy="30" r="7" fill="#6366F1"/>
    <circle cx="48" cy="48" r="22" fill="url(#hubGradient)"/>
    <circle cx="48" cy="48" r="13" fill="#131928"/>
    <circle cx="44" cy="44" r="5" fill="#fff" opacity="0.85"/>
    <path d="M 36 48 a 12 12 0 0 1 12 -12" stroke="url(#hubInner)" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Wordmark centred under the icon -->
  <text x="99" y="148" text-anchor="middle"
        font-family="'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="40" font-weight="800" letter-spacing="-1.5">
    <tspan fill="url(#prefixGradient)">all</tspan><tspan fill="#fff">seerr</tspan>
  </text>
</svg>

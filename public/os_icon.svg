<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- Allseerr icon — central seerr-style hub + 6 media-type
       satellites on a hexagonal orbit. Conveys the "single hub
       that aggregates every kind of media" pitch. Colours match
       the in-app badges: book / audiobook / game / movie / tv /
       manga. -->
  <defs>
    <linearGradient id="hubGradient" x1="48" x2="48" y1="30" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C395FC"/>
      <stop offset="1" stop-color="#4F65F5"/>
    </linearGradient>
    <linearGradient id="hubInner" x1="42" x2="42" y1="42" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Faint dotted orbit connecting the satellites -->
  <circle cx="48" cy="48" r="36" stroke="#374151" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- 6 media-type satellites at radius 36, clockwise from top:
       movie / tv / game / audiobook / book / manga. -->
  <circle cx="48" cy="12" r="7" fill="#EF4444"/>      <!-- Movie  — red    -->
  <circle cx="79.18" cy="30" r="7" fill="#F59E0B"/>   <!-- TV     — amber  -->
  <circle cx="79.18" cy="66" r="7" fill="#10B981"/>   <!-- Game   — emerald-->
  <circle cx="48" cy="84" r="7" fill="#EC4899"/>      <!-- Audio  — pink   -->
  <circle cx="16.82" cy="66" r="7" fill="#F97316"/>   <!-- Book   — orange -->
  <circle cx="16.82" cy="30" r="7" fill="#6366F1"/>   <!-- Manga  — indigo -->

  <!-- Central seerr-style hub -->
  <circle cx="48" cy="48" r="22" fill="url(#hubGradient)"/>
  <circle cx="48" cy="48" r="13" fill="#131928"/>
  <circle cx="44" cy="44" r="5" fill="#fff" opacity="0.85"/>
  <path d="M 36 48 a 12 12 0 0 1 12 -12" stroke="url(#hubInner)" stroke-width="2" fill="none" opacity="0.6"/>
</svg>

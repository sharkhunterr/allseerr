<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" fill="none">
  <!-- Allseerr horizontal logo: icon + wordmark.
       Icon = central hub + 6 media-type satellites (see os_icon.svg
       for the full design rationale). Wordmark uses Inter — same
       font family the app already loads through @fontsource-variable
       — with a subtle gradient on "all" so the prefix reads as the
       differentiator from upstream "seerr". -->
  <defs>
    <linearGradient id="hubGradient" x1="48" x2="48" y1="30" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C395FC"/>
      <stop offset="1" stop-color="#4F65F5"/>
    </linearGradient>
    <linearGradient id="hubInner" x1="42" x2="42" y1="42" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prefixGradient" x1="100" x2="160" y1="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C395FC"/>
      <stop offset="1" stop-color="#4F65F5"/>
    </linearGradient>
  </defs>

  <!-- Icon block (96x96) -->
  <g>
    <circle cx="48" cy="48" r="36" stroke="#374151" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
    <circle cx="48" cy="12" r="7" fill="#EF4444"/>
    <circle cx="79.18" cy="30" r="7" fill="#F59E0B"/>
    <circle cx="79.18" cy="66" r="7" fill="#10B981"/>
    <circle cx="48" cy="84" r="7" fill="#EC4899"/>
    <circle cx="16.82" cy="66" r="7" fill="#F97316"/>
    <circle cx="16.82" cy="30" r="7" fill="#6366F1"/>
    <circle cx="48" cy="48" r="22" fill="url(#hubGradient)"/>
    <circle cx="48" cy="48" r="13" fill="#131928"/>
    <circle cx="44" cy="44" r="5" fill="#fff" opacity="0.85"/>
    <path d="M 36 48 a 12 12 0 0 1 12 -12" stroke="url(#hubInner)" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Wordmark — "all" gradient + "seerr" white. font-weight 800
       to match the chunky proportions of the original seerr SVG
       paths. -->
  <text x="108" y="64"
        font-family="'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="56" font-weight="800" letter-spacing="-2">
    <tspan fill="url(#prefixGradient)">all</tspan><tspan fill="#fff">seerr</tspan>
  </text>
</svg>
